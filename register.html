<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CodeWix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">CodeWix</a></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="register.html" style="color: #38bdf8;">Register an Account</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>Create <span>Account</span></h2>
            <div id="errorBox" class="error-box"></div>
            <form id="registerForm" action="#">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="button">Sign Up</button>
                <div class="form-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </form>
        </div>
    </div>

        <footer>
        <p>© 2026 CodeWix Learn to Code</p>
        <a href="#">Terms and Conditions</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Contact Us</a>
    </footer>

    <!-- Firebase compat SDK — MUST be here, before script.js -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <!-- App logic -->
    <script src="script.js"></script>
</body>
</html>
