<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CodeWix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <header>
        <div class="logo"><a href="index.html">CodeWix</a></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="register.html">Register an Account</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>Reset <span>Password</span></h2>
            <p class="forgot-intro">
                Enter the email address you used to sign up and we'll send you a link to choose a new password.
            </p>

            <div id="errorBox" class="error-box"></div>
            <div id="successBox" class="success-box"></div>

            <form id="forgotForm" action="#">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required autofocus>
                </div>
                <button type="submit" class="button">Send Reset Link</button>
                <div class="form-footer">
                    Remembered it? <a href="login.html">Back to login</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 CodeWix Learn to Code</p>
        <a href="tos.html">Terms and Conditions</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="contact.html">Contact Us</a>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
