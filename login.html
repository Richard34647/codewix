<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeWix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo"><a href="index.html">CodeWix</a></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="register.html">Register an Account</a>
            <a href="login.html" style="color: #38bdf8;">Login</a>
        </nav>
    </header>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>Welcome <span>Back</span></h2>
            <div id="errorBox" class="error-box"></div>
            <form id="loginForm" action="#">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div class="forgot-row">
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="button">Log In</button>
                <div class="form-footer">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 CodeWix Learn to Code</p>
        <a href="tos.html">Terms and Conditions</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="contact.html">Contact Us</a>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="script.js"></script>

    <script>
        // Show a green success banner if the user just reset their password
        // (Firebase redirects back here with ?reset=success after the hosted reset page)
        if (new URLSearchParams(location.search).get('reset') === 'success') {
            var box = document.getElementById('errorBox');
            if (box) {
                box.className = 'success-box';
                box.textContent = '✅ Password reset successful! Log in with your new password.';
                box.style.display = 'block';
            }
            // Clean the URL so refreshing doesn't re-show the banner
            history.replaceState({}, '', location.pathname);
        }
    </script>
</body>
</html>
