<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Workspace | CodeWix</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- CodeMirror styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

    <link rel="stylesheet" href="style.css">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RPX2BV738C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RPX2BV738C');
</script>
</head>
<body>

    <header class="studio-header">
        <div class="header-brand">
            <span class="studio-logo">CodeWix</span>
            <span class="env-badge">HTML/JS Sandbox</span>
        </div>
        <nav class="studio-nav">
            <a href="dashboard.html" class="active">Workspace</a>
            <a href="learn.html">Learn</a>
            <a href="ai-assistance.html">AI Assistant</a>
            <a href="explore.html">Explore</a>
        </nav>
        <div class="user-session">
            <span id="dashUser">Developer</span>
            <button class="exit-btn" id="logoutBtn">Exit Studio</button>
        </div>
    </header>

    <main class="studio-workspace">

        <aside class="file-explorer">
            <div class="panel-header">
                <h3>Files</h3>
                <button class="action-icon-btn" id="newFileBtn" title="Create New File">+</button>
            </div>
            <ul class="file-list" id="fileTreeList">
                <li class="file-item active" data-filename="index.html">🌐 index.html</li>
                <li class="file-item" data-filename="style.css">🎨 style.css</li>
                <li class="file-item" data-filename="script.js">⚡ script.js</li>
            </ul>
        </aside>

        <section class="editor-area">
            <div class="panel-header">
                <div class="active-tab-indicator">
                    Editing: <span id="currentFileLabel">index.html</span>
                    <span id="unsavedIndicator" class="unsaved-indicator" style="display:none;">● unsaved</span>
                </div>
                <div class="editor-controls">
                    <button class="studio-btn ghost-btn" id="newProjectBtn">New</button>
                    <button class="studio-btn ghost-btn" id="myProjectsBtn">My Projects</button>
                    <button class="studio-btn ghost-btn" id="saveProjectBtn">Save</button>
                    <button class="studio-btn" id="downloadFileBtn">⬇ Download File</button>
                    <button class="studio-btn" id="downloadZipBtn">📦 Download All</button>
                    <button class="studio-btn" id="shareProjectBtn">🔗 Share</button>
                    <a href="publish.html" class="studio-btn" id="publishBtn" title="Publish as a live site">🚀 Publish</a>
                    <button class="studio-btn primary-btn" id="runCodeBtn">Build &amp; Run</button>
                </div>
            </div>
            <div class="editor-body">
                <textarea id="codeEditorSource" spellcheck="false" autocomplete="off"></textarea>
            </div>
        </section>

        <section class="preview-area">
            <div class="panel-header">
                <h3>Live Preview Output</h3>
            </div>
            <div class="preview-frame-container">
                <iframe id="livePreviewFrame" sandbox="allow-scripts allow-modals"></iframe>
            </div>
        </section>

    </main>

    <footer class="studio-status-bar">
        <div class="status-left-node">
            <span class="status-indicator-dot online"></span>
            <span id="userEmail">Session active</span>
        </div>
        <div class="status-right-node">
            <span id="projectStatusLabel">No project loaded</span>
            <span>Encoding: UTF-8</span>
            <span>DOM Engine: Active</span>
        </div>
    </footer>

    <!-- Projects Modal -->
    <div class="modal-backdrop" id="projectsModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>My Projects</h2>
                <button class="modal-close" id="closeProjectsModalBtn">×</button>
            </div>
            <div class="modal-body" id="projectsListContainer">
                <p class="modal-empty">Loading…</p>
            </div>
        </div>
    </div>

    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- CodeMirror core + modes + addons (matchtags removed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
