<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Workspace | CodeWix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== Top Header ===================== -->
    <header class="studio-header">
        <div class="header-brand">
            <span class="studio-logo">CodeWix</span>
            <span class="env-badge">HTML/JS Sandbox</span>
        </div>
        <nav class="studio-nav">
            <a href="dashboard.html" class="active">Workspace</a>
            <a href="ai-assistant.html">AI Assistant</a>
        </nav>
        <div class="user-session">
            <span id="dashUser">Developer</span>
            <button class="exit-btn" id="logoutBtn">Exit Studio</button>
        </div>
    </header>

    <!-- ===================== Workspace ===================== -->
    <main class="studio-workspace">

        <!-- File Explorer -->
        <aside class="file-explorer">
            <div class="panel-header">
                <h3>Files</h3>
                <button class="action-icon-btn" id="newFileBtn" title="Create New File">+</button>
            </div>
            <ul class="file-list" id="fileTreeList">
                <li class="file-item active" data-filename="index.html">🌐 index.html</li>
                <li class="file-item" data-filename="style.css">🎨 style.css</li>
                <li class="file-item" data-filename="script.js">⚡ script.js</li>
            </ul>
        </aside>

        <!-- Editor -->
        <section class="editor-area">
            <div class="panel-header">
                <div class="active-tab-indicator">
                    Editing: <span id="currentFileLabel">index.html</span>
                    <span id="unsavedIndicator" class="unsaved-indicator" style="display:none;">● unsaved</span>
                </div>
                <div class="editor-controls">
                    <button class="studio-btn ghost-btn" id="newProjectBtn" title="Start a new empty project">New</button>
                    <button class="studio-btn ghost-btn" id="myProjectsBtn" title="Open a saved project">My Projects</button>
                    <button class="studio-btn ghost-btn" id="saveProjectBtn" title="Save current project">Save</button>
                    <button class="studio-btn" id="downloadFileBtn" title="Download current file">⬇ Download File</button>
                    <button class="studio-btn" id="downloadZipBtn" title="Download all files as ZIP">📦 Download All</button>
                    <button class="studio-btn primary-btn" id="runCodeBtn">Build &amp; Run</button>
                </div>
            </div>
            <div class="editor-body">
                <div class="gutter-line-numbers" id="editorLineGutter">1</div>
                <textarea class="raw-code-input" id="codeEditor" spellcheck="false" autocomplete="off"></textarea>
            </div>
        </section>

        <!-- Live Preview -->
        <section class="preview-area">
            <div class="panel-header">
                <h3>Live Preview Output</h3>
            </div>
            <div class="preview-frame-container">
                <iframe id="livePreviewFrame" sandbox="allow-scripts allow-modals"></iframe>
            </div>
        </section>

    </main>

    <!-- ===================== Status Bar ===================== -->
    <footer class="studio-status-bar">
        <div class="status-left-node">
            <span class="status-indicator-dot online"></span>
            <span id="userEmail">Session active</span>
        </div>
        <div class="status-right-node">
            <span id="projectStatusLabel">No project loaded</span>
            <span>Encoding: UTF-8</span>
            <span>DOM Engine: Active</span>
        </div>
    </footer>

    <!-- ===================== Projects Modal ===================== -->
    <div class="modal-backdrop" id="projectsModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2>My Projects</h2>
                <button class="modal-close" id="closeProjectsModalBtn">×</button>
            </div>
            <div class="modal-body" id="projectsListContainer">
                <p class="modal-empty">Loading…</p>
            </div>
        </div>
    </div>

    <!-- ===================== Scripts ===================== -->
    <!-- JSZip for "Download All" -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Firebase compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <!-- App logic -->
    <script src="script.js"></script>
</body>
</html>
