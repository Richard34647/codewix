<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile — CodeWix</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container { max-width: 1000px; margin: 100px auto 60px; padding: 0 20px; }
        .profile-header { display: flex; align-items: center; gap: 24px; background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 40px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #38bdf8, #34d399); color: #020617; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .profile-info h1 { margin: 0 0 8px; font-size: 28px; }
        .profile-info p { margin: 0; color: #94a3b8; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 10px; vertical-align: middle; }
        .badge.free { background: #334155; color: #cbd5e1; }
        .badge.pro { background: #fbbf24; color: #020617; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { font-size: 32px; color: #38bdf8; margin: 0 0 5px; }
        .stat-card p { color: #94a3b8; margin: 0; font-size: 14px; }
        .my-sites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .site-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; text-decoration: none; color: white; display: flex; flex-direction: column; }
        .site-preview { height: 160px; background: #020617; border-bottom: 1px solid #334155; position: relative; }
        .site-preview iframe { width: 400%; height: 400%; border: none; transform: scale(0.25); transform-origin: 0 0; pointer-events: none; }
        .site-info { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .site-info h3 { margin: 0 0 4px; font-size: 16px; }
        .site-info p { margin: 0; font-size: 13px; color: #64748b; }
        .domain-btn { margin-top: auto; display: block; width: 100%; text-align: center; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #cbd5e1; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; transition: 0.2s; margin-top: 12px;}
        .domain-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">CodeWix</a></div>
        <nav>
            <a href="dashboard.html">Workspace</a>
            <a href="explore.html">Explore</a>
            <a href="upgrade.html">Upgrade</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar" id="profAvatar">...</div>
            <div class="profile-info">
                <h1 id="profName">Loading... <span id="profBadge" class="badge free">...</span></h1>
                <p id="profEmail">Please wait...</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="statProjects">-</h3>
                <p>Published Projects</p>
            </div>
            <div class="stat-card">
                <h3 id="statViews">-</h3>
                <p>Total Views</p>
            </div>
        </div>

        <h2 style="margin-bottom: 20px;">Your Published Sites</h2>
        <div class="my-sites-grid" id="profileSitesGrid">
            <p style="color: #64748b;">Loading sites...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
