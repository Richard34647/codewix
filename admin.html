<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeWix Admin</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 250px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar h2 { padding: 20px; color: var(--accent); border-bottom: 1px solid var(--border); }
    .nav-btn { padding: 15px 20px; background: none; border: none; color: var(--text-muted); text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--bg); color: var(--accent); border-left: 4px solid var(--accent); }
    
    /* Main Content */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .page-title { margin-bottom: 20px; font-size: 24px; }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-card h3 { color: var(--text-muted); font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
    .stat-card p { font-size: 32px; font-weight: bold; color: var(--accent); }
    
    /* Tables & Forms */
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 600; color: var(--text-muted); }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge.free { background: #475569; color: white; }
    .badge.premium { background: #4ade80; color: #000; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: #ef4444; color: white; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: white; }
    .form-group textarea { height: 150px; resize: vertical; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>CodeWix Admin</h2>
    <button class="nav-btn active" data-target="dashboard">📊 Dashboard</button>
    <button class="nav-btn" data-target="users">👥 Users</button>
    <button class="nav-btn" data-target="lessons">📚 Lessons</button>
    <button class="nav-btn" onclick="window.location.href='index.html'">← Back to Site</button>
  </div>

  <div class="main-content">
    <!-- Dashboard Tab -->
    <div id="dashboard" class="tab-section active">
      <h1 class="page-title">Overview</h1>
      <div class="stats-grid">
        <div class="stat-card"><h3>Total Users</h3><p id="statUsers">0</p></div>
        <div class="stat-card"><h3>Premium Users</h3><p id="statPremium">0</p></div>
        <div class="stat-card"><h3>Projects Published</h3><p id="statProjects">0</p></div>
        <div class="stat-card"><h3>Total Lessons</h3><p id="statLessons">0</p></div>
      </div>
    </div>

    <!-- Users Tab -->
    <div id="users" class="tab-section">
      <h1 class="page-title">User Management</h1>
      <table id="adminUsersTable">
        <thead>
          <tr><th>Email</th><th>Name</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody><tr><td colspan="4" style="text-align:center;">Loading...</td></tr></tbody>
      </table>
    </div>

    <!-- Lessons Tab -->
    <div id="lessons" class="tab-section">
      <h1 class="page-title">Lesson Manager</h1>
      
      <div style="background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 30px;">
        <h3 style="margin-bottom: 15px;">Add New Lesson</h3>
        <div class="form-group"><label>Title</label><input type="text" id="lessonTitle" placeholder="e.g. Intro to JavaScript"></div>
        <div class="form-group"><label>Description</label><input type="text" id="lessonDesc" placeholder="Short summary..."></div>
        <div class="form-group"><label>Difficulty</label>
          <select id="lessonDiff">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <div class="form-group"><label>Content (Markdown or HTML)</label><textarea id="lessonContent" placeholder="Type lesson content here..."></textarea></div>
        <button class="btn btn-primary" id="saveLessonBtn">Save Lesson</button>
      </div>

      <table id="adminLessonsTable">
        <thead>
          <tr><th>Title</th><th>Difficulty</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody><tr><td colspan="4" style="text-align:center;">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
